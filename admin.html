alter table public.lessons
add column if not exists date text;

alter table public.lessons
add column if not exists comment text;

notify pgrst, 'reload schema';<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Portefólio de Arquitetura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: #f7f4ef; }
    .admin-shell { max-width: 1100px; margin: 0 auto; padding: 40px 22px 80px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 32px; }
    .admin-title { font-size: clamp(28px, 4vw, 42px); letter-spacing: -.06em; margin: 0; }
    .admin-panel { display: grid; grid-template-columns: 1.1fr 1.6fr; gap: 18px; }
    .panel { background: #f3efe9; border: 1px solid rgba(32,35,31,.1); border-radius: 18px; padding: 28px; box-shadow: 0 12px 30px rgba(32,35,31,.04); }
    .lesson-form { display: flex; flex-direction: column; gap: 16px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .lesson-form label { display: flex; flex-direction: column; gap: 8px; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .lesson-form input, .lesson-form textarea { width: 100%; border: 1px solid rgba(32,35,31,.12); border-radius: 12px; padding: 12px 14px; font: 500 15px var(--sans); color: var(--ink); background: rgba(255,255,255,.6); }
    .lesson-form textarea { min-height: 120px; resize: vertical; }
    .button { border: 0; display: inline-flex; justify-content: center; align-items: center; gap: 10px; padding: 14px 18px; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; cursor: pointer; transition: transform .2s ease; }
    .button:hover { transform: translateY(-2px); }
    .button-light { background: #c5df4d; color: var(--ink); }
    .form-feedback { min-height: 20px; margin: 0; font: 500 12px var(--mono); color: var(--ink); }
    .lessons-grid { grid-template-columns: 1fr; }
    @media (max-width: 820px) {
      .admin-panel { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="admin-shell">
    <header class="admin-header">
      <div>
        <p class="section-kicker">Admin</p>
        <h1 class="admin-title">Gestão do portefólio</h1>
      </div>
      <a class="button button-light" href="https://dinisgaspar.github.io/Arquitetura-de-computadores/index.html">Ver página pública</a>
    </header>

    <div class="admin-panel">
      <section class="panel">
        <form class="lesson-form" id="lesson-form">
          <div class="form-row">
            <label>Número<input id="lesson-number" type="text" placeholder="03 e 04" required></label>
            <label>Data<input id="lesson-date" type="text" placeholder="03 OUT 2024" required></label>
          </div>
          <label>Sumário<textarea id="lesson-summary" rows="3" placeholder="O que foi abordado na aula?" required></textarea></label>
          <label>Comentário<textarea id="lesson-comment" rows="4" placeholder="Escreve a tua reflexão..." required></textarea></label>
          <button class="button button-light" type="submit">Guardar aula</button>
          <p class="form-feedback" id="form-feedback" role="status"></p>
        </form>
      </section>

      <section class="panel">
        <div class="lesson-toolbar">
          <label class="search-box"><span aria-hidden="true">⌕</span><input id="search-input" type="search" placeholder="Pesquisar aulas..." aria-label="Pesquisar aulas"></label>
          <div class="lesson-count"><span id="lesson-count">0</span> registos</div>
        </div>
        <div class="lessons-grid" id="lessons-grid"></div>
        <p class="empty-state" id="empty-state" hidden>Não existem aulas registadas.</p>
      </section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
